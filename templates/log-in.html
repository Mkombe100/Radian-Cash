<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In</title>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    background-image: url("../assets/coin2.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family:'Segoe UI', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
}


.login-container {

    background-color:rgba(255,255,255,0.95);
    width:100%;
    max-width:420px;
    padding:40px 35px;
    border-radius:16px;
    box-shadow:0 12px 40px rgba(0,0,0,0.15);
    border:1px solid rgba(255,204,17,0.25);

}


h1 {

    color:#FFCC11;
    font-size:2rem;
    font-weight:700;
    margin-bottom:8px;
    text-align:center;

}


.subtitle {

    color:#FFCC11;
    text-align:center;
    font-size:0.95rem;
    margin-bottom:25px;

}


.messages {

    list-style:none;
    margin-bottom:20px;

}


.messages li {

    background:#FFCC11;
    color:white;
    padding:12px 16px;
    border-radius:8px;
    font-size:0.9rem;

}


.form-group {

    margin-bottom:18px;

}


label {

    display:block;
    color:#FFCC11;
    font-weight:600;
    margin-bottom:7px;

}


input[type="email"],
input[type="password"] {

    width:100%;
    padding:13px 14px;
    border:2px solid #FFCC11;
    border-radius:10px;
    font-size:1rem;
    outline:none;

}


input:focus {

    box-shadow:0 0 0 4px rgba(255,204,17,0.25);

}


input::placeholder {

    color:#bbb;

}


.submit-btn {

    width:100%;
    padding:15px;
    background:#FFCC11;
    color:white;
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;

}


.submit-btn:hover {

    background:#e6b800;

}


.signup-link {

    text-align:center;
    margin-top:22px;
    font-size:0.9rem;

}


.signup-link a {

    color:#FFCC11;
    text-decoration:none;
    font-weight:600;

}


/* Mobile */

@media(max-width:520px){

    body {
        padding:8px;
    }


    .login-container {

        padding:25px 18px;
        border-radius:12px;

    }


    h1 {

        font-size:1.5rem;

    }


    .subtitle {

        font-size:0.85rem;

    }


    input[type="email"],
    input[type="password"] {

        padding:11px 12px;
        font-size:0.9rem;

    }


    .submit-btn {

        padding:13px;

    }

}

</style>

</head>


<body>


<div class="login-container">


<h1>RADIAN CASH</h1>

<p class="subtitle">
Welcome back
</p>


{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}

<ul class="messages">

{% for category, message in messages %}

<li>{{ category }}: {{ message }}</li>

{% endfor %}

</ul>

{% endif %}
{% endwith %}



<form action="/log-in" method="post">


<div class="form-group">

<label for="email">
Email
</label>

<input 
type="email"
id="email"
name="email"
placeholder="you@example.com"
required>

</div>



<div class="form-group">

<label for="password">
Password
</label>

<input
type="password"
id="password"
name="password"
placeholder="••••••••"
required>

</div>



<button type="submit" class="submit-btn">
Log In
</button>


</form>



<p class="signup-link">

Don't have an account?

<a href="/signup">
Create an account
</a>

</p>


</div>


</body>
</html>

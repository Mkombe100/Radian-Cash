<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: none;
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body.show-image {
            background-image: url("{{ url_for('static', filename='assets/coin2.jpg') }}");
        }

        .login-container {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 204, 17, 0.25);
        }

        h1 {
            color: #FFCC11;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #FFCC11;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .messages {
            list-style: none;
            margin-bottom: 24px;
        }

        .messages li {
            background-color: #FFCC11;
            color: #FFFFFF;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #FFCC11;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #FFCC11;
            border-radius: 10px;
            font-size: 1rem;
            color: #333;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #FFCC11;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
        }

        .signup-link {
            text-align: center;
            margin-top: 28px;
            font-size: 0.95rem;
        }

        .signup-link a {
            color: #FFCC11;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>RADIAN CASH</h1>
        <p class="subtitle">Welcome back</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="messages" id="flashMessage">
                    {% for category, message in messages %}
                        <li>{{ category }}: {{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}


        <form action="/log-in" method="post">

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="you@example.com" 
                    required>
            </div>


            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required>
            </div>


            <button type="submit" class="submit-btn">
                Log In
            </button>

        </form>


        <p class="signup-link">
            Dont have an account?
            <a href="/signup">Create an account</a>
        </p>

    </div>


<script>
window.onload = function(){

    let message = document.getElementById("flashMessage");

    if(message){

        setTimeout(function(){
            document.body.classList.add("show-image");
        }, 3000);

    } else {

        document.body.classList.add("show-image");

    }

}
</script>

</body>
</html>
